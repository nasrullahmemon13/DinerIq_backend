[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths = tests

markers =
    functional: Functional requirement tests
    integration: Cross-component end-to-end integration tests
    big_data_ingestion: Ingestion of large-scale raw data feeds into Parquet & DB
    schema_validation: Relational DDL, Parquet schema, and Pydantic validation tests
    data_quality: Data cleaning, quarantine, null-checks, and deduplication tests
    spark_transformation: PySpark DataFrame aggregations, joins, and feature engineering
    spark_sql: PySpark SQL queries, window functions, and analytics
    spark_model: PySpark MLlib model training, evaluation, and pipeline inference
    python_model: Python Scikit-Learn, Prophet, and Statsmodels model tests
    dual_pipeline_comparison: Discrepancy analysis and parity tests between Spark and Python
    forecast: Time-series demand and revenue forecasting tests
    basket_analysis: Market-basket analysis, Apriori / FP-Growth association rules
    wastage: Kitchen wastage, spoilage risk, and cost-reduction tests
    promotion: Promotion effectiveness, discount elasticity, and campaign tests
    pricing: Menu item pricing, elasticity, and margin optimization tests
    anomaly: Sales spike/drop and rating anomaly detection tests
    security: Authentication, RBAC, header injection, and access control tests
    boundary: Edge cases, zero values, extreme thresholds, and boundary conditions
    hidden_data_readiness: Cold-start, unseen entities, missing features, and unseen locations
    difficult_cases: The exact 11 challenging real-world edge cases from SRS
